<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-primary text-white shadow-md">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-semibold">Calculadora de Presupuesto</h1>
      <button class="hidden md:flex items-center gap-2 px-3 py-2 rounded hover:bg-white/10" 
              (click)="generatePDF()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v3.586l-1.293-1.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V8z" clip-rule="evenodd" />
        </svg>
        <span>PDF</span>
      </button>
    </div>
  </header>

  <!-- Content -->
  <div class="container mx-auto px-4 py-6">
    <!-- Desktop View -->
    <div class="hidden md:block">
      <div class="bg-white rounded-lg shadow-md overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="w-[5%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">N°</th>
              <th class="w-[35%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
              <th class="w-[15%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Unidad</th>
              <th class="w-[12%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cantidad</th>
              <th class="w-[15%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Precio Unit.</th>
              <th class="w-[12%] px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subtotal</th>
              <th class="px-6 py-3 text-right">
                <button class="bg-accent hover:bg-accent/90 text-white rounded-full p-2" 
                        (click)="addNewItem()">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                  </svg>
                </button>
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let item of budgetItems">
              <td class="px-6 py-4 whitespace-nowrap">{{item.id}}</td>
              <td class="px-6 py-4">
                <input type="text" [(ngModel)]="item.description" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="Descripción del ítem">
              </td>
              <td class="px-6 py-4">
                <select [(ngModel)]="item.unit"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option *ngFor="let unit of availableUnits" [value]="unit">{{unit}}</option>
                </select>
              </td>
              <td class="px-6 py-4">
                <input type="number" [(ngModel)]="item.quantity" (ngModelChange)="calculateSubtotal(item)"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       min="0" placeholder="Cantidad">
              </td>
              <td class="px-6 py-4">
                <div class="relative">
                  <span class="absolute left-3 top-2">$</span>
                  <input type="number" [(ngModel)]="item.unitPrice" (ngModelChange)="calculateSubtotal(item)"
                         class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                         min="0" placeholder="Precio">
                </div>
              </td>
              <td class="px-6 py-4 text-right font-medium text-primary">
                $ {{item.subtotal | number:'1.2-2'}}
              </td>
              <td class="px-6 py-4 text-right flex gap-2 justify-end">
                <button class="text-gray-500 hover:text-gray-700" 
                        (click)="resetItem(item)"
                        matTooltip="Limpiar campos">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
                  </svg>
                </button>
                <button class="text-warn hover:text-warn/80" 
                        (click)="removeItem(item)" 
                        [disabled]="budgetItems.length <= 1">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                  </svg>
                </button>
              </td>
            </tr>
            <tr class="bg-gray-50">
              <td colspan="5" class="px-6 py-4 text-right font-bold">Total</td>
              <td class="px-6 py-4 text-right font-bold text-primary">$ {{total | number:'1.2-2'}}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Mobile View -->
    <div class="md:hidden space-y-4 pb-32">
      <!-- Add Button Floating -->
      <button class="fixed right-4 bottom-24 z-10 bg-accent hover:bg-accent/90 text-white rounded-full p-4 shadow-lg"
              (click)="addNewItem()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
      </button>

      <!-- Items Cards -->
      <div *ngFor="let item of budgetItems" class="bg-white rounded-lg shadow-md p-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-medium">Ítem {{item.id}}</h3>
          <div class="flex gap-2">
            <button class="text-gray-500 hover:text-gray-700" 
                    (click)="resetItem(item)">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
              </svg>
            </button>
            <button class="text-warn hover:text-warn/80" 
                    (click)="removeItem(item)"
                    [disabled]="budgetItems.length <= 1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>

        <div class="space-y-4">
          <!-- Descripñción -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
            <input type="text" [(ngModel)]="item.description"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                   placeholder="Descripción del ítem">
          </div>

          <!-- Unidad y Cantidad -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
              <select [(ngModel)]="item.unit"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <option *ngFor="let unit of availableUnits" [value]="unit">{{unit}}</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
              <input type="number" [(ngModel)]="item.quantity" (ngModelChange)="calculateSubtotal(item)"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                     min="0" placeholder="Cantidad">
            </div>
          </div>

          <!-- Precio y Subtotal -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Precio Unitario</label>
              <div class="relative">
                <span class="absolute left-3 top-2">$</span>
                <input type="number" [(ngModel)]="item.unitPrice" (ngModelChange)="calculateSubtotal(item)"
                       class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       min="0" placeholder="Precio">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Subtotal</label>
              <div class="px-3 py-2 bg-gray-50 rounded-md text-right font-medium text-primary">
                $ {{item.subtotal | number:'1.2-2'}}
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Total Section -->
      <div class="fixed bottom-0 left-0 right-0 bg-white shadow-lg border-t border-gray-200 p-4">
        <div class="container mx-auto">
          <div class="flex items-center justify-between mb-4">
            <span class="text-gray-700">Total estimado:</span>
            <span class="text-xl font-bold text-primary">$ {{total | number:'1.2-2'}}</span>
          </div>
          <button class="w-full bg-primary hover:bg-primary/90 text-white py-2 px-4 rounded-md flex items-center justify-center gap-2"
                  (click)="generatePDF()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v3.586l-1.293-1.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V8z" clip-rule="evenodd" />
            </svg>
            <span>Descargar Presupuesto</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
